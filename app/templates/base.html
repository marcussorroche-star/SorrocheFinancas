<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Sorroche Finanças
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #f4f6f9;
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            color: #1f2937;
        }

        .sidebar {
            min-height: 100vh;
            background:
                linear-gradient(
                    180deg,
                    #111827 0%,
                    #1f2937 100%
                );
            color: white;
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            padding: 20px;
            border-bottom: 1px solid #374151;
            letter-spacing: .2px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 13px 20px;
            transition: .2s;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover {
            background: #374151;
            border-left-color: #60a5fa;
            padding-left: 24px;
        }

        .conteudo-principal {
            padding: 30px;
        }

        .dashboard-header {
            background:
                radial-gradient(
                    circle at top right,
                    rgba(59,130,246,.30),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #111827,
                    #1e3a5f
                );
            color: white;
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow:
                0 15px 35px rgba(15,23,42,.12);
            overflow: hidden;
            position: relative;
        }

        .dashboard-header h1 {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .dashboard-header p {
            margin: 0;
            opacity: .78;
        }

        .mobile-access-card,
        .finance-card,
        .ia-card,
        .chart-card,
        .summary-card,
        .quick-card {
            border: none;
            border-radius: 18px;
            box-shadow:
                0 7px 24px rgba(15,23,42,.06);
            background: white;
        }

        .mobile-access-card {
            margin-bottom: 24px;
            overflow: hidden;
        }

        .mobile-access-card .card-body {
            padding: 25px;
        }

        .qr-box {
            background:
                linear-gradient(
                    145deg,
                    #f8fafc,
                    #eef2ff
                );
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        #qrcode {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 14px;
            border-radius: 14px;
            width: 210px;
            height: 210px;
            margin: 0 auto;
            box-shadow:
                0 8px 25px rgba(15,23,42,.08);
        }

        #qrcode img,
        #qrcode canvas {
            width: 180px !important;
            height: 180px !important;
            max-width: 180px;
        }

        .mobile-url {
            word-break: break-all;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13px;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .finance-card {
            transition:
                transform .2s ease,
                box-shadow .2s ease;
            height: 100%;
        }

        .finance-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 14px 30px rgba(15,23,42,.10);
        }

        .finance-label {
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
        }

        .finance-value {
            font-size: 25px;
            font-weight: 800;
            margin-top: 8px;
        }

        .finance-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
        }

        .icon-green {
            background: #dcfce7;
        }

        .icon-red {
            background: #fee2e2;
        }

        .icon-blue {
            background: #dbeafe;
        }

        .icon-purple {
            background: #ede9fe;
        }

        .icon-yellow {
            background: #fef3c7;
        }

        .section-title {
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .section-subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .ia-card {
            margin-bottom: 24px;
            border-left: 6px solid #0d6efd;
        }

        .ia-card .card-body {
            padding: 22px;
        }

        .chart-card {
            height: 100%;
            overflow: hidden;
        }

        .chart-card .card-body {
            padding: 24px;
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-container canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .summary-line {
            padding: 13px 0;
            border-bottom: 1px solid #eef0f3;
        }

        .summary-line:last-child {
            border-bottom: none;
        }

        .progress {
            height: 9px;
            border-radius: 20px;
            background: #e5e7eb;
        }

        .progress-bar {
            border-radius: 20px;
        }

        .small-muted {
            color: #6b7280;
            font-size: 13px;
        }

        .btn-modern {
            border-radius: 10px;
            font-weight: 600;
        }

        .qr-ok {
            color: #198754;
            font-weight: 600;
        }

        .qr-error {
            color: #dc3545;
            font-weight: 600;
        }

        @media (max-width: 767px) {

            .conteudo-principal {
                padding: 15px;
            }

            .sidebar {
                min-height: auto;
                position: relative;
            }

            .dashboard-header {
                padding: 22px;
                border-radius: 17px;
            }

            .dashboard-header h1 {
                font-size: 25px;
            }

            .chart-container {
                height: 280px;
            }

            #qrcode {
                width: 200px;
                height: 200px;
            }

        }

    </style>

    {% block head %}{% endblock %}

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- MENU -->

        <aside class="col-md-3 col-lg-2 p-0 sidebar">

            <div class="logo">
                Sorroche Finanças
            </div>

            <nav class="mt-2">

                <a href="/">
                    &#127968; Dashboard
                </a>

                <a href="/receitas/">
                    &#128176; Receitas
                </a>

                <a href="/despesas/">
                    &#128184; Despesas
                </a>

                <a href="/cartoes/">
                    &#128179; Cartões
                </a>

                <a href="/juros/">
                    &#128200; Juros
                </a>

                <a href="/investimentos/">
                    &#128202; Investimentos
                </a>

                <a href="/metas/">
                    &#127919; Metas
                </a>

                <a href="/pastas/">
                    &#128194; Pastas
                </a>

                <a href="/financeiro/">
                    &#128188; Financeiro
                </a>

                <a href="/financeiro/relatorio/mensal">
                    &#128202; Relatórios
                </a>

                <a href="/ia/">
                    &#129302; IA Financeira
                </a>

                <a href="/whatsapp/">
                    &#128241; WhatsApp
                </a>

                <a href="/whatsapp/qr">
                    &#128242; Conectar WhatsApp
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO -->

        <main class="col-md-9 col-lg-10 conteudo-principal">

            {% block conteudo %}{% endblock %}

        </main>

    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const qr = document.getElementById("qrcode");

        if (qr && typeof QRCode !== "undefined") {

            qr.innerHTML = "";

            const endereco =
                window.location.protocol +
                "//" +
                window.location.hostname +
                ":" +
                window.location.port;

            new QRCode(qr, {
                text: endereco,
                width: 180,
                height: 180
            });

            const enderecoElemento =
                document.getElementById(
                    "enderecoCelular"
                );

            if (enderecoElemento) {
                enderecoElemento.textContent =
                    endereco;
            }

            const status =
                document.getElementById(
                    "qrStatus"
                );

            if (status) {

                status.textContent =
                    "QR Code pronto.";

                status.className =
                    "qr-ok mt-3";
            }

        }

    }
);

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


{% block scripts %}{% endblock %}

</body>

</html>
