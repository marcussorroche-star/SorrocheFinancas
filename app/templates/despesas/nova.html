{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Nova despesa</h2>
            <p class="text-muted mb-0">
                Cadastre uma nova despesa.
            </p>
        </div>

        <a
            href="{{ url_for('despesas.index') }}"
            class="btn btn-outline-secondary"
        >
            Voltar
        </a>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form
                method="POST"
                action="{{ url_for('despesas.nova') }}"
            >

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Descrição
                        </label>

                        <input
                            type="text"
                            name="descricao"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Categoria
                        </label>

                        <input
                            type="text"
                            name="categoria"
                            class="form-control"
                            placeholder="Ex.: Mercado, Casa, Transporte"
                            required
                        >

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Valor
                        </label>

                        <input
                            type="number"
                            name="valor"
                            class="form-control"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Data da despesa
                        </label>

                        <input
                            type="date"
                            name="data"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Vencimento
                        </label>

                        <input
                            type="date"
                            name="vencimento"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Forma de pagamento
                        </label>

                        <select
                            name="forma_pagamento"
                            class="form-select"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="Dinheiro">
                                Dinheiro
                            </option>

                            <option value="Pix">
                                Pix
                            </option>

                            <option value="Débito">
                                Débito
                            </option>

                            <option value="Crédito">
                                Crédito
                            </option>

                            <option value="Boleto">
                                Boleto
                            </option>

                            <option value="Outro">
                                Outro
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option value="Pendente">
                                Pendente
                            </option>

                            <option value="Pago">
                                Pago
                            </option>

                        </select>

                    </div>

                </div>


                <div class="d-flex justify-content-end gap-2 mt-3">

                    <a
                        href="{{ url_for('despesas.index') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Salvar despesa
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
