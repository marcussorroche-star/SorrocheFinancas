{% extends "base.html" %}

{% block conteudo %}

<div class="container mt-5">
    <h2>Login</h2>

    <form>
        <div class="mb-3">
            <label>E-mail</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-3">
            <label>Senha</label>
            <input type="password" class="form-control">
        </div>

        <button class="btn btn-primary">
            Entrar
        </button>
    </form>

</div>

{% endblock %}
